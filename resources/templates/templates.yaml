  # -------------------------------------------------------------------------
  # The three entries below are real, well-known open-source LaTeX templates
  # (not in-house mockups like the five above). Each source_file is the
  # actual upstream .tex/.cls compiled with ./bin/tectonic to produce the
  # paired PDF -- not a redrawn approximation. Every one needed small,
  # disclosed compatibility patches (marked "PATCHED for tectonic
  # compatibility" inline in the .tex/.cls) to compile under the vendored
  # tectonic binary: a font substituted for one requiring OS-level install,
  # a fontawesome6 icon name aliased to its fontawesome5 equivalent, a
  # biber-dependent bibliography section dropped (no biber binary vendored).
  # None of these changes alter the template's layout, colors, or typography
  # choices -- see `source.repo` for the unmodified original and
  # `source.license` for its license. Like the five above, these are
  # `experimental`: metadata + a reference PDF only, no renderer, not
  # releasable. See resources/templates/<id>/ for the full source tree
  # (class file, fonts, sub-included section files) needed to recompile.
  #
  # A fifth real template, an Awesome-CV academic-CV variant, was dropped:
  # it shared the exact same .cls/visual design as awesome-cv-resume below,
  # differing only in which sections were included -- a near-duplicate, not
  # a visually distinct option.
  #
  # An AltaCV entry was also dropped from this registry (Phase 5, D-8
  # follow-up): its source_file pointed at resources/templates/altacv/, but
  # that directory (source tree + reference PDF) was never actually added to
  # the repo, so `validate_registry()` would fail on a broken path. Re-add it
  # only once the real AltaCV source tree and a compiled reference PDF are
  # committed alongside it.
  # -------------------------------------------------------------------------

  - id: awesome-cv-resume
    name: Awesome CV -- Resume (icon header, colored accent, dense professional)
    status: experimental
    version: "0.1.0"
    source_file: awesome-cv-resume/resume-example.pdf
    source:
      repo: https://github.com/posquit0/Awesome-CV
      license: LPPL-1.3c (class) / CC-BY-SA-4.0 (example content)
      author: Claud D. Park (posquit0)
      patched: >
        fontawesome6 (not in the vendored tectonic bundle) swapped for
        fontawesome5, with a handful of fa6-only icon names (mobile,
        house-chimney, cake-candles, square-github/whatsapp/xing, x-twitter)
        aliased to their fa5 equivalents. Source Sans 3/Roboto (OS-level
        fonts fontspec can't resolve here) swapped for the CTAN roboto
        package. Example contact details replaced with placeholders; the
        employment history is the upstream author's own published example.
    page: unknown
    typography: unknown
    layout:
      sections: [summary, experience, honors, certifications, education]
      unsupported_sections: [skills, projects]
      columns: 1
      tables_allowed: unknown
      text_boxes_allowed: unknown
      graphics_allowed: unknown
      style: >
        Centered header with icon-prefixed contact row, a single accent
        color (default red) on name/section rules, dense single-column
        experience section with bold company/role lines. Metadata only --
        no renderer exists for this layout.
    sections:
      order: [summary, experience, honors, certifications, education]
      headings: unknown
    spacing: unknown
    limits: unknown
    formatting: unknown
    latex: unknown
    best_for:
      keywords: [senior, staff, lead, infrastructure, devops, sre, backend]
      experience_level: [senior, mid]
      resume_signals: [many_experience_entries]
      notes: >
        Senior/staff-level candidates with a long work history and a
        certifications list worth surfacing -- professional and dense
        rather than design-forward.

  - id: deedy-cv
    name: Deedy CV (dense two-column, grayscale, education/coursework-heavy)
    status: experimental
    version: "0.1.0"
    source_file: deedy-cv/deedy-cv-example.pdf
    source:
      repo: https://github.com/deedy/Deedy-Resume
      license: Apache-2.0
      author: Debarghya Das
      patched: >
        None needed beyond copying the bundled OpenFonts variant's fonts/
        directory alongside the .tex (the template ships its own Lato/
        Raleway font files, so no OS font install or CTAN substitution was
        required). Compiled as-is with the vendored tectonic. Content is the
        upstream author's own famous, widely-forked example resume --
        de-identifying it would misrepresent this well-known reference, so
        it is kept verbatim. Known limitation of the original template
        (not a tectonic issue): very dense content can overflow/overlap at
        the bottom of the fixed single-page two-column layout, as it does
        here in the Awards/Publications area.
    page: unknown
    typography: unknown
    layout:
      sections: [education, skills, experience]
      unsupported_sections: [coursework, links, research, awards,
                              publications]
      columns: unknown
      tables_allowed: unknown
      text_boxes_allowed: unknown
      graphics_allowed: unknown
      style: >
        Grayscale two-column layout, oversized name in a thin display font,
        education-first left column with coursework/skills, dense right
        column for experience/research/awards/publications. No dedicated
        certifications section in the upstream example. Metadata only -- no
        renderer exists for this layout.
    sections:
      order: [education, skills, experience]
      headings: unknown
    spacing: unknown
    limits: unknown
    formatting: unknown
    latex: unknown
    best_for:
      keywords: [research, new grad, graduate, campus, coursework]
      experience_level: [intern, entry]
      resume_signals: [many_achievements, coursework_relevant,
                        research_experience]
      notes: >
        New-grad or research-adjacent candidates with a strong coursework/
        awards list to fill the dense two-column format; overflows quickly
        with more than ~1.5 pages of real content (see `patched` note).


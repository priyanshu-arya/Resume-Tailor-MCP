# Resume layout templates -- a HARD WHITELIST (spec §26-30).
#
# Only the ids registered here exist; nothing else can be requested, and
# Claude cannot invent layouts or control formatting. Each entry carries:
#   status   supported | experimental | unsupported
#   version  semver of the template contract
#   the §29 contract: page, typography, layout, sections, spacing, limits,
#            formatting (+ latex for a LaTeX-rendered template)
#
# There is exactly ONE production renderer in v1: `classic-minimalist`
# (lib/latex.py, compiled to PDF with tectonic). Its contract values are
# measured from the compiled PDF. Every other template is `experimental`
# metadata: it has no visual renderer, so contract fields the project does
# not actually define are the literal string `unknown` rather than guessed.
# A request for an experimental template is NEVER rendered with another
# template -- it resolves as-is, is reported as not releasable, and the
# render/release gate refuses it (TEMPLATE_NO_RENDERER /
# TEMPLATE_NOT_RELEASABLE).
#
# `layout.sections` / `layout.unsupported_sections` / `best_for` /
# `source_file` are also read by the recommender and the md/docx exporter.
# Section names match top-level resume keys; any listed section that isn't
# part of the resume schema (e.g. "achievements") is documentation only.
#
# Completeness rule (lib/schemas.py: CONTRACT_REQUIREMENTS / contract_gaps):
# a `status: supported` entry MUST fully specify every block/key listed in
# CONTRACT_REQUIREMENTS -- no "unknown" anywhere in it. A `status:
# experimental` entry MAY leave any of those fields "unknown", and an
# unmeasured field MUST be the literal string "unknown" rather than a guess.
# This is enforced both at load time (TemplateContract's model validator,
# for a malformed registry in the repo) and at release time
# (`template.contract_complete` in lib/release.py, for a hand-edited YAML).
templates:
  - id: full-stack-modern
    name: Modern Full-Stack (colored headers, keyword-rich summary)
    status: experimental
    version: "0.1.0"
    source_file: Template 1.pdf
    page: unknown
    typography: unknown
    layout:
      sections: [summary, skills, experience, projects, certifications, education]
      unsupported_sections: []
      columns: unknown
      tables_allowed: unknown
      text_boxes_allowed: unknown
      graphics_allowed: unknown
      style: >
        Colored section headers with a rule underneath, bold inline keyword
        emphasis in the summary and bullets, skills shown as
        "Category : comma, separated, list", certifications called out as
        their own section, projects include a tech-stack line and source
        link. Metadata only -- no renderer exists for this layout.
    sections:
      order: [summary, skills, experience, projects, certifications, education]
      headings: unknown
    spacing: unknown
    limits: unknown
    formatting: unknown
    latex: unknown
    best_for:
      keywords: [react, angular, vue, php, rest, mvc, html, css, javascript,
                 node.js, express, full-stack, web]
      experience_level: [mid]
      resume_signals: [has_certifications]
      notes: >
        Full-stack / web developer JDs, and candidates who have
        certifications worth surfacing via a keyword-dense summary
        paragraph. 2-5 years of experience.

  - id: classic-minimalist
    name: Classic Minimalist (Jake's Resume style)
    status: supported
    version: "1.2.0"
    source_file: Template 2.pdf
    page:
      size: letter
      width_pt: 612
      height_pt: 792
      orientation: portrait
      margins_in: {top: 0.6, bottom: 0.5, left: 0.6, right: 0.6}
    typography:
      font_family: Latin Modern Roman        # LaTeX default (Computer Modern family); plain serif, Times-like
      pdf_font_prefixes: [LMRoman, LMRomanCaps, CMSY, CMMI, CMR]   # fonts the PDF may embed
      body: {size_pt: 10}                    # \small in an 11pt article class
      name: {size_pt: 20.7, weight: bold}    # \huge
      heading: {size_pt: 12, weight: bold}   # \large\bfseries
      size_tolerance_pt: 0.1
    layout:
      sections: [summary, experience, projects, skills, education, certifications]
      unsupported_sections: []
      columns: 1
      tables_allowed: false
      text_boxes_allowed: false
      graphics_allowed: false
      layout_only_exceptions: ["tabularx in entry headings (title/date alignment only; title column wraps)"]
      style: >
        The production layout: rendered by lib/latex.py and compiled to PDF
        with tectonic. It is the only template with a renderer; it is never
        used as a stand-in for another template id. Centered header with
        contact links, dense action-verb bullets, pipe-separated project
        tech stacks, categorized technical skills. The most widely
        recognized ATS-safe SWE resume format.
    sections:
      order: [summary, experience, projects, skills, education, certifications]
      headings:
        summary: Summary
        experience: Experience
        projects: Projects
        skills: Technical Skills
        education: Education
        certifications: Certifications
    spacing:
      section: "\\vspace{2pt} + titlerule"
      bullet: "itemsep=2pt"
      line_spacing: single
    limits: {min_pages: 1, max_pages: 2}
    formatting:
      bullet_style: itemize
      date_style: as written in master
      heading_style: bold small caps + rule
      link_style: hyperref hidelinks
    latex:
      documentclass_options: [letterpaper, 11pt]
      layout_only_macros: [resumeSubheading, resumeProjectHeading]
      topmargin_adjust_in: -0.4
      textheight_adjust_in: 0.9
      side_margin_adjust_in: -0.4
      textwidth_adjust_in: 0.8
    # Documentation-only map: contract path -> the check id that enforces it
    # (or "n/a (...)" for a path that is structural/unmeasurable rather than
    # a live check). Every CONTRACT_REQUIREMENTS key must appear here
    # (validate_registry() checks this).
    enforcement:
      page.size: template.page_size
      page.width_pt: template.page_size
      page.height_pt: template.page_size
      page.orientation: "n/a (implied by the exact width/height compare)"
      page.margins_in: template.margins
      typography.font_family: template.font_family
      typography.pdf_font_prefixes: pdf.embedded_fonts
      typography.body: template.body_font_size
      typography.name: template.name_font_size
      typography.heading: template.heading_font_size
      typography.size_tolerance_pt: template.body_font_size
      layout.sections: structure.section_order
      layout.columns: template.columns
      layout.tables_allowed: template.forbidden_structures
      layout.text_boxes_allowed: template.forbidden_structures
      layout.graphics_allowed: template.forbidden_structures
      sections.order: structure.section_order
      sections.headings: structure.section_headings
      spacing.section: template.heading_style
      spacing.bullet: template.spacing
      spacing.line_spacing: template.spacing
      limits.min_pages: pdf.page_count
      limits.max_pages: pdf.page_count
      formatting.bullet_style: template.bullet_style
      formatting.date_style: "n/a (dates are not patchable; unmeasurable property)"
      formatting.heading_style: template.heading_style
      formatting.link_style: template.link_style
      latex.documentclass_options: template.base_font_size
      latex.layout_only_macros: template.forbidden_structures
    best_for:
      keywords: [research, api, backend, full-stack, ci/cd, git, rest,
                 microservices]
      experience_level: [entry, mid]
      resume_signals: [many_projects, research_experience]
      notes: >
        Research-adjacent or academically-flavored software engineering
        JDs, or as a strong general default -- dense on substance, no
        wasted space.

